<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Library</title>
  <link id="favicon" rel="icon" type="image/x-icon" href="" />
  <link rel="stylesheet" href=".videxer/assets/styles.css">
  <script src=".videxer/assets/app.js" defer></script>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Library controls">
      <div class="brand">
        <span class="brand-title"></span>
      </div>
      <div class="controls">
        <label for="search" class="visually-hidden">Search</label>
  <input id="search" class="input" placeholder="Search media, subtitles, descriptions..." />
        <div class="row">
          <label for="sort" class="visually-hidden">Sort by</label>
          <select id="sort" class="select">
            <option value="date" selected>Date</option>
            <option value="alpha">Alphabetical</option>
            <option value="size">Size</option>
            <option value="type">Type</option>
          </select>
          <button id="direction" class="btn" aria-pressed="false">Descending</button>
          <button id="view" class="btn" aria-pressed="false">Grid</button>
        </div>
        <div class="row" id="thumbSizeRow">
          <button class="btn size-btn" data-size="s">S</button>
          <button class="btn size-btn" data-size="m">M</button>
          <button class="btn size-btn" data-size="l">L</button>
          <button class="btn size-btn" data-size="xl">XL</button>
        </div>
      </div>
    </nav>
    <main class="main" role="main">
      <div id="breadcrumb" class="breadcrumb"></div>
      <div class="container"></div>
    </main>

    <!-- Immersive player: fixed overlay on mobile, flex sibling on desktop -->
    <div id="immersive" class="immersive" aria-hidden="true">
      <div class="immersive-panel">
        <div class="immersive-header">
          <button id="immersiveClose" class="immersive-close" aria-label="Close">Back</button>
          <div id="immersiveTitle" class="immersive-title">Media</div>
          <div id="qualityControls" class="quality" style="display:none"></div>
        </div>
        <div class="immersive-content">
          <div id="immersiveMedia" class="immersive-media"></div>
          <div id="immersiveInfo" class="immersive-info"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal media player/viewer -->
  <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <div id="playerTitle" class="modal-title">Media</div>
        <div class="modal-actions">
          <button id="playerInfo" class="modal-action-btn" aria-label="Info" title="Info">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
          </button>
          <a id="playerDownload" class="modal-action-btn" aria-label="Download" title="Download" download>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-7 2l-3-3h2V5h2v3h2l-3 3zm-7 6v2h14v-2H5z"/></svg>
          </a>
          <button id="playerClose" class="modal-close" aria-label="Close">×</button>
        </div>
      </div>
      <div id="playerMedia" class="modal-body">
        <div id="playerInfoPanel" class="modal-info-panel"></div>
      </div>
      <button id="imgPrev" class="img-nav img-prev" aria-label="Previous image">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <button id="imgNext" class="img-nav img-next" aria-label="Next image">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>
  </div>

</body>
</html>
