[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videxer"
version = "0.8.3"
description = "Static media library gallery generator that creates static webpages for viewing. Supports video, images, and audio."
authors = [{name = "Ben Baptist"}]
requires-python = ">=3.9"
dependencies = [
  "click>=8.1.7",
  "opencv-python>=4.8.0",
  "Pillow>=9.0.0",
  "PyYAML>=6.0",
  "ffmpeg-python>=0.2.0",
]

[project.scripts]
videxer = "videxer.cli:cli"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
videxer = ["templates/*"]
